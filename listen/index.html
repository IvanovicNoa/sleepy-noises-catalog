<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src https: data:; connect-src 'self' https://feeds.megaphone.fm; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Listen on Sleepy Noises</title>
  <meta name="description" content="Sleep sounds and bedtime stories. Open this episode in the Sleepy Noises app.">
  <meta property="og:title" content="Listen on Sleepy Noises">
  <meta property="og:description" content="Sleep sounds and bedtime stories.">
  <meta name="theme-color" content="#0B0F13">
  <link rel="stylesheet" href="listen.css">
</head>
<body>
  <main class="card">
    <div class="art" id="art" aria-hidden="true"><span class="moon"></span></div>
    <p class="show" id="show">Sleepy Noises</p>
    <h1 id="title">Sleep sounds and bedtime stories</h1>
    <p class="meta" id="meta"></p>
    <a class="button primary" id="open" href="#">Open in Sleepy Noises</a>
    <a class="button" id="store" href="#" hidden>Get the app</a>
    <p class="soon" id="soon">Coming soon to the App Store.</p>
    <p class="summary" id="summary"></p>
  </main>
  <script src="listen.js"></script>
</body>
</html>
