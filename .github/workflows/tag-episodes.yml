name: Tag episodes

# Asks Claude to tag new episodes (scripts/tag_episodes.py) and opens a pull
# request with the result for Noa to review. Needs the ANTHROPIC_API_KEY
# secret (Settings → Secrets and variables → Actions); without it, the run
# just says so and stops.
on:
  workflow_dispatch:
    inputs:
      max:
        description: Most episodes to tag in this run
        default: "500"
  schedule:
    - cron: "17 5 * * 1" # Mondays, 05:17 UTC

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: tag-episodes
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    # The API key is given to the two steps that need it, not to the whole
    # job: every step of a job (other people's actions too) can read the
    # job's environment.
    steps:
      - name: Check for the API key
        id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::notice::ANTHROPIC_API_KEY is not set; nothing to do. Add it under Settings → Secrets and variables → Actions."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.key.outputs.present == 'true'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        if: steps.key.outputs.present == 'true'
        with:
          python-version: "3.12"
      - name: Install the tagging script's packages
        if: steps.key.outputs.present == 'true'
        run: pip install -r scripts/requirements-tagging.txt
      - name: Tag new episodes
        if: steps.key.outputs.present == 'true'
        # What was typed into "Run workflow" arrives as a variable and is
        # checked to be a number: pasted into the command, it would be run
        # as part of it.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAX_EPISODES: ${{ inputs.max || '500' }}
        run: |
          case "$MAX_EPISODES" in
            ''|*[!0-9]*) echo "::error::\"Most episodes\" must be a whole number."; exit 1 ;;
          esac
          python scripts/tag_episodes.py --max "$MAX_EPISODES"
      - name: Open a pull request for review
        if: steps.key.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- tags.json; then
            echo "No new tags."
            exit 0
          fi
          branch="tags/$(date -u +%Y-%m-%d-%H%M)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add tags.json
          git commit -m "tags: new episodes tagged by Claude"
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Episode tags: review new episodes" \
            --body "Claude tagged the episodes below with traits from the app's vocabulary. Check them in the diff (remove or change any that are wrong) and merge; the app picks them up after the next publish."
