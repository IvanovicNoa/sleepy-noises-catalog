name: Publish

# Every change to main is validated, then published to
# https://listen.sleepynoises.com/catalog.json
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

# Actions are named by commit, with their version beside it: a tag can be
# moved to other code, a commit cannot. Dependabot proposes the updates.
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # All of main's history, to read the catalog as it was before.
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      # Each package pinned to one version and to its files' checksums: what
      # runs here decides what is published.
      - run: |
          pip install --require-hashes --only-binary :all: -r scripts/requirements-check.txt
      - name: Tests of the scripts
        run: python -m unittest discover -s scripts -p "test_*.py"
      - name: The catalog before this change
        # A pull request is compared with the branch it goes into, a push
        # with what was there before it. Read through `env`, never pasted
        # into the script.
        env:
          BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE:catalog.json" 2>/dev/null; then
            git show "$BEFORE:catalog.json" > "$RUNNER_TEMP/previous.json"
          elif git cat-file -e "origin/main:catalog.json" 2>/dev/null; then
            git show "origin/main:catalog.json" > "$RUNNER_TEMP/previous.json"
          fi
      - name: Validate catalog.json and tags.json
        run: |
          if [ -f "$RUNNER_TEMP/previous.json" ]; then
            python scripts/check_catalog.py --previous "$RUNNER_TEMP/previous.json"
          else
            python scripts/check_catalog.py
          fi
      - name: Assemble site
        run: |
          mkdir -p _site
          cp catalog.json catalog.schema.json tags.json tags.schema.json _site/
          if [ -d images ]; then cp -r images _site/; fi
          # Landing page for links shared from the app (…/listen/?show=…).
          cp -r listen _site/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

  feeds:
    # Reports what the app will see for each feed (size, episode hosts,
    # streaming support). Warnings only: it never blocks publishing.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Check feeds
        run: python scripts/check_feeds.py

  tagging:
    # The Tag episodes workflow runs on its own, on Mondays, with the API
    # key. Here, with no key and at no cost: its packages still install as
    # pinned, the script still fits the SDK (a stand-in answers for the
    # API), and it still reads the feeds. An update of the SDK that breaks
    # it is red on its pull request. Never blocks publishing.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - run: |
          pip install --require-hashes --only-binary :all: -r scripts/requirements-tagging.txt
      - name: The script with the SDK, against a stand-in for the API
        run: python -m unittest discover -s scripts -p "test_tagging_with_the_sdk.py"
      - name: What the next run would send
        run: python scripts/tag_episodes.py --dry-run --max 20

  deploy:
    # Only publish from main, never from a pull request or a manual run on
    # another branch.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
