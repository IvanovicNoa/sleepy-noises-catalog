name: Publish

# Every change to main is validated, then published to
# https://ivanovicnoa.github.io/sleepy-noises-catalog/catalog.json
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install "jsonschema[format]==4.*"
      - name: Validate catalog.json
        run: |
          python - <<'PY'
          import json, jsonschema
          schema = json.load(open("catalog.schema.json"))
          data = json.load(open("catalog.json"))
          jsonschema.validate(data, schema, format_checker=jsonschema.FormatChecker())
          ids = [p["id"] for p in data["podcasts"]]
          assert len(ids) == len(set(ids)), "duplicate podcast id"
          cat_ids = [c["id"] for c in data["categories"]]
          assert len(cat_ids) == len(set(cat_ids)), "duplicate category id"
          missing = [p["id"] for p in data["podcasts"] if p["categoryId"] not in cat_ids]
          assert not missing, f"unknown categoryId on {missing}"
          placeholders = [p["id"] for p in data["podcasts"] if "REPLACE-WITH" in p["feedUrl"]]
          if placeholders:
              print(f"::warning::placeholder feed URLs still in use: {placeholders}")
          print("catalog OK:", len(ids), "podcasts")

          # Reviewed episode tags (optional file, see scripts/tag_episodes.py).
          tags = json.load(open("tags.json"))
          jsonschema.validate(
              tags,
              json.load(open("tags.schema.json")),
              format_checker=jsonschema.FormatChecker(),
          )
          keys = [(e["podcastId"], e["guid"]) for e in tags["episodes"]]
          assert len(keys) == len(set(keys)), "duplicate podcastId + guid in tags.json"
          unknown = sorted({p for p, _ in keys} - set(ids))
          assert not unknown, f"tags.json names unknown podcasts {unknown}"
          print("tags OK:", len(keys), "episodes")
          PY
      - name: Assemble site
        run: |
          mkdir -p _site
          cp catalog.json catalog.schema.json tags.json tags.schema.json _site/
          if [ -d images ]; then cp -r images _site/; fi
          # Landing page for links shared from the app (…/listen/?show=…).
          cp -r listen _site/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  feeds:
    # Reports what the app will see for each feed (size, episode hosts,
    # streaming support). Warnings only: it never blocks publishing.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check feeds
        run: python scripts/check_feeds.py

  deploy:
    # Only publish from main, never from a pull request or a manual run on
    # another branch.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
